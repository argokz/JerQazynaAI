# Минимальная инфраструктура исследовательской фазы: метаданные, растры, реестр моделей.
# FastAPI, очередь задач, TiTiler и интерфейс подключаются после контрольной точки 3.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jerqazyna
      POSTGRES_USER: ${POSTGRES_USER:-jerqazyna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jerqazyna}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?задайте MINIO_ROOT_PASSWORD в .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]

volumes:
  pgdata:
  miniodata:
  mlflowdata:
