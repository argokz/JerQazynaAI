[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jerqazyna"
version = "0.1.0"
description = "ML-прогноз перспективности месторождений Казахстана на открытых данных"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
emit = [
    "earthaccess==0.19.0; python_version >= '3.12'",
    "h5netcdf==1.8.1",
    "h5py>=3.12",
    "matplotlib>=3.10",
    "xarray>=2025.6",
    "rasterio>=1.4",
    "geopandas>=1.1",
    "shapely>=2.1",
    "pyogrio>=0.11",
]
baseline = [
    "scikit-learn>=1.3,<1.8",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
]
geo = [
    "rasterio>=1.3",
    "geopandas>=1.0",
    "pandas>=2.0",
    "pyogrio>=0.7",
    "openpyxl>=3.1",
    "shapely>=2.0",
    "xarray>=2023.1",
    "pystac-client>=0.7",
    "odc-stac>=0.3.9",
    "dask>=2023.1",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.44",
    "mlflow>=2.9",
]
# Веб-карта (web/): API карточек ячеек и экспорт COG. Тайлы отдаёт TiTiler в Docker.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rasterio>=1.3",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
jerqazyna = "jerqazyna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
