[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jerqazyna"
version = "0.1.0"
description = "ML-прогноз перспективности месторождений Казахстана на открытых данных"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "xarray>=2023.1",
]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.44",
    "mlflow>=2.9",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
jerqazyna = "jerqazyna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
