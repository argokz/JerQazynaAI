# Задача 1: порфировая медь, слепой регион — Прибалхашье (Балхаш-Илийская дуга).
task_id: porphyry_cu_balkhash
deposit_type: porphyry_cu
seed: 42

grid:
  # Альберс для Центральной Азии: доля ячеек = доля площади.
  crs: "+proj=aea +lat_0=45 +lat_1=40 +lat_2=52 +lon_0=70 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs"
  cell_size_m: 1000

# Область обучения: весь Центрально-Азиатский пояс в границах этих стран.
training_countries: [KAZ, UZB, KGZ, TJK]
# Тот же пояс за границей: Синьцзян и юг России (Урал, Алтай) внутри рамки сетки.
# Иран не включён: Тетический пояс с кайнозойскими месторождениями, другая металлогения.
extra_countries: [CHN, RUS]

labels:
  # Основной источник: глобальная база USGS 2025 (Magnin et al.), только порфировые типы CMMI.
  source: data/raw/usgs_porphyry_2025/Porphyry_datasheet.csv
  encoding: latin-1
  lon_field: LONGITUDE
  lat_field: LATITUDE
  name_field: DEPOSIT
  status_field: null            # в базе 2025 нет статуса; берётся из пакета 2010 при совпадении
  type_field: CMMI_DEPOSIT_TYPE
  type_regex: "^Porphyry"
  extra_fields:
    deposit_type: CMMI_DEPOSIT_TYPE
    country: COUNTRY
    tonnage_mt: ORE_TONNAGE_MT
    cu_pct: CU_PERCENT
    age_ma: ASSIGNED_AGE_MA
  # Пакет USGS 2010: проспекты, которых нет в базе 2025, и статус «deposit / prospect».
  merge:
    - source: data/raw/usgs_sir2010_5090n/sir2010_5090n_gis/Central_Asia_pCu.gdb
      layer: Central_Asia_deposits_prospects
      name_field: Name
      status_field: SiteStatus
  merge_radius_m: 5000
  include_prospects: true
  mine_mask_buffer_m: 3000   # маска карьеров и отвалов для спектральных признаков

# kind — обработчик из src/jerqazyna/features/layers.py; role: feature | benchmark | mask | bias
layers:
  - name: dem
    group: terrain
    source: data/raw/cop_dem_glo90
    kind: dem                      # средняя высота, перепад высот в ячейке, уклон

  - name: sentinel2
    group: spectral
    source: data/raw/sentinel2_l2a
    kind: sentinel2_indices        # отношения каналов: глины (B11/B12), оксиды железа (B4/B2) и др.

  - name: aster_alteration
    group: spectral
    source: data/raw/usgs_sir2010_5090n/sir2010_5090n_gis/Central_Asia_pCu.gdb
    kind: aster_alteration         # доля площади ячейки с аргиллизитами, филлизитами, окварцеванием
    params:
      layers: {argillic: Central_Asia_argillic, phyllic: Central_Asia_phyllic, silicic: Central_Asia_silicic}
      coverage_layer: Central_Asia_ASTER_scene_index

  - name: magnetics
    group: geophysics
    source: data/raw/emag2v3
    kind: magnetics                # аномалия и её горизонтальный градиент
    params: {file: EMAG2_V3_UpCont_DataTiff.tif, src_crs: "EPSG:4326"}

  - name: gravity
    group: geophysics
    source: data/raw/ggmplus_dg
    kind: ggmplus_bouguer          # возмущение, простая аномалия Буге и её градиент (после dem)

  - name: geology
    group: geology
    source: data/raw/usgs_fsu_geology
    kind: categorical_polygons     # доля пород каждого класса, расстояние до интрузий
    # Поле Glg: Q, N, K, Pz ...; интрузии оканчиваются на «i» (TKi, Mzi). Pulkovo 1942, без .prj.
    params: {pattern: "fsu_geol.shp", field: GLG, src_crs: "EPSG:4284", distance_to_regex: "i$"}

  - name: lithology
    group: geology
    source: "data/raw/glim/LiMW_GIS_2015.gdb/LiMW_GIS 2015.gdb"
    kind: categorical_polygons     # GLiM: 16 классов литологии, одна карта на все страны
    # pa/pi — кислые и средние плутонические породы: расстояние до них ключевое для порфиров.
    params: {layer: GLiM_export, field: xx, distance_to_regex: "^(pa|pi)$"}

  - name: faults_active
    group: geology
    source: data/raw/gem_active_faults
    kind: distance_to_lines
    params: {pattern: "*.geojson"}

  # Зоны USGS 2010 строились с учётом известных объектов: только эталон, не признак.
  - name: usgs_2010_tracts
    group: geology
    source: data/raw/usgs_sir2010_5090n/sir2010_5090n_gis/Central_Asia_pCu.gdb
    kind: polygon_fraction
    role: benchmark
    params: {layer: Central_Asia_tracts}

  - name: mine_mask
    group: mask
    source: data/raw/mining_polygons_v2
    kind: mine_mask                # горные выработки + буфер labels.mine_mask_buffer_m
    role: mask
    params: {pattern: "*.gpkg"}

  - name: exploration_density
    group: bias
    source: data/raw/usgs_mrds
    kind: point_density            # плотность рудопроявлений MRDS: прокси изученности
    role: bias
    params: {sigma_km: 10}

model:
  kind: random_forest
  params:
    n_estimators: 500
    min_samples_leaf: 5
    class_weight: balanced

validation:
  blind_region:
    name: Прибалхашье
    geometry: configs/regions/balkhash_blind.geojson   # зафиксировать до первого обучения
    buffer_m: 20000
  spatial_block_size_m: 50000
  area_fractions: [0.05, 0.10, 0.20]
  bootstrap_iterations: 2000
  confidence: 0.95
  success_area_fraction: 0.20
  success_capture_lower_bound: 0.70   # предварительно, уточнить с геологом
  temporal_test: false                # нет подтверждённого списка открытий после 2010 года
