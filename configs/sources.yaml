    title: "GLiM: глобальная литологическая карта 1:3,75 млн"
    roles: [geology]
    access: direct
    license: "Свободно с цитированием (авторы публикуют через Dropbox, см. CSDMS и CCGM)"
    citation: "Hartmann, Moosdorf, 2012, https://doi.org/10.1029/2012GC004370"
    size_mb: 1140
