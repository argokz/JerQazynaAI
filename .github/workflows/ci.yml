name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  baseline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -c requirements/py310-baseline.txt -e ".[geo,baseline,dev]"
      - run: python -c "import sklearn, joblib, rasterio, geopandas"
      - run: pytest -q

  geo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -c requirements/py310-geo.txt -e ".[geo,dev]"
      - run: python -c "import rasterio, geopandas, pyogrio, openpyxl"
      - run: pytest -q

  emit-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements/py312-emit.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/test_label_review.py tests/test_emit.py tests/test_emit_science.py tests/test_emit_login.py tests/test_emit_coverage.py -q
